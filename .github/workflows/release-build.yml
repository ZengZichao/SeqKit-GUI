name: Release build

# Build the Windows bundle for a version tag. It produces a workflow *artifact*
# and stops there: creating the GitHub Release, writing its notes and attaching
# the file is a human act, because the release text carries the unofficial-
# project disclaimer and the "seqkit is not included" warning that no automation
# should word for itself.
#
# Facts this workflow encodes:
#   * Triggered by a tag push, so the version has exactly one source: the tag is
#     reconciled against seqkit_gui/__init__.py and the build stops if they differ.
#   * Only Windows is packaged. The application is Windows-first and the bundle
#     has been built and started on Windows; the macOS/Linux recipes exist in the
#     spec but have never been run, so publishing a bundle from them would be a
#     claim nobody tested.
#   * SeqKit is NEVER inside the artifact. Four independent checks enforce it,
#     because "we do not redistribute seqkit" is a licensing position, not a
#     packaging preference: the recipe refuses to collect anything from bin/
#     (packaging/seqkit_gui.spec), the built tree is walked for seqkit executables
#     and for a bin/ directory, the finished zip is read entry by entry with
#     Python's zipfile, and that zip is then listed again with `unzip -l` and
#     searched by grep -- a different tool, asked the same question.
#   * The artifact's file name is composed from the same APP_NAME the recipe
#     names the folder and executable after, read through
#     `python packaging/check_version.py --get artifact-stem`. Neither this file
#     nor a release note carries a second spelling of it.
#   * One sibling file, `<zip name>.sha256`, in `sha256sum -c` format. That is the
#     second asset a human attaches to a Release.
#   * permissions is contents: read. Publishing a Release needs the write scope on
#     contents, and this workflow deliberately does not hold it. Nothing here
#     creates a Release, uploads a release asset, or touches a tag.


on:
  push:
    tags:
      - 'v*'
  # A manual run builds from whatever is checked out and uploads the artifact,
  # with no tag to reconcile. Use it to verify this file end to end before
  # cutting the first real tag.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  # A release build is never cancelled midway; the artifact may be the one a
  # human is about to attach.
  cancel-in-progress: false

jobs:
  windows:
    name: 'build (windows-x64)'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Reconcile the tag with the version declared in the source
        id: version
        env:
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            python packaging/check_version.py --tag "$REF"
          else
            # A manual run has no tag; the declared version still names the build.
            python packaging/check_version.py
          fi
          # Read back out of the same checker that just validated the tree, as bare
          # values: this file holds no copy of the regular expressions that pull a
          # version or a product name out of the source, and `--get` refuses to print
          # anything while the declarations disagree. The name of the artifact and of
          # the folder inside it therefore cannot drift from the recipe that builds
          # them. Assignments, not command substitutions inside echo, so a failure
          # stops the job instead of emitting an empty version.
          APP_VERSION="$(python packaging/check_version.py --get app-version)"
          ARTIFACT_STEM="$(python packaging/check_version.py --get artifact-stem)"
          SEQKIT_VERSION="$(python packaging/check_version.py --get seqkit-version)"
          {
            echo "value=$APP_VERSION"
            echo "stem=$ARTIFACT_STEM"
            echo "seqkit_version=$SEQKIT_VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Bundle version: $APP_VERSION, artifact stem: $ARTIFACT_STEM, SeqKit $SEQKIT_VERSION"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The interpreter the project declares as its floor and the bundle was
          # built and started with; the artifact a user installs must not depend
          # on whichever Python a runner happens to default to.
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the pinned build toolchain
        run: |
          python -m pip install --upgrade pip
          # One transaction so the resolver cannot quietly pick a different Qt
          # than the one this recipe was validated against. Bump these two pins
          # deliberately, together with a fresh local build and start-up check.
          python -m pip install \
            "PySide6==6.12.0" \
            "pyinstaller==6.22.3" \
            -r requirements.txt
          # pytest and PyYAML are here for the release-consistency assertions run
          # below, before anything is built: this job is the one that has to catch a
          # tag whose tree does not agree with itself. Neither can reach the
          # artifact -- packaging/seqkit_gui.spec lists pytest in `excludes`, and
          # PyYAML is a CI-side tool the application never imports.
          python -m pip install "pytest>=8.0" "PyYAML>=6.0"
          python -m PyInstaller --version
          python -c "import PySide6.QtCore as q; print('Qt', q.qVersion())"

      - name: Run the release-consistency assertions
        run: python -m pytest tests/test_release_consistency.py -q -rs

      - name: Build the onedir bundle
        run: python -m PyInstaller --noconfirm --log-level WARN packaging/seqkit_gui.spec

      - name: Inspect the bundle
        env:
          ARTIFACT_STEM: ${{ steps.version.outputs.stem }}
        run: |
          python - <<'PY'
          import os, pathlib
          # The stem is the recipe's own APP_NAME, so the executable, the folder and
          # the artifact file all carry one spelling rather than three.
          stem = os.environ["ARTIFACT_STEM"]
          root = pathlib.Path("dist") / stem
          files = [p for p in root.rglob("*") if p.is_file()]
          total = sum(p.stat().st_size for p in files)
          print(f"{len(files)} files, {total/1024/1024:.1f} MB")
          # The three resource folders the recipe collects, each with a file the
          # application reads at start-up, plus the launcher itself.
          for expected in (f"{stem}.exe", "_internal/seqkit_gui/data/commands.json",
                           "_internal/seqkit_gui/i18n/zh_CN.json",
                           "_internal/seqkit_gui/i18n/en_US.json",
                           "_internal/seqkit_gui/assets/app.ico"):
              present = (root / expected).is_file()
              print(f"{'ok  ' if present else 'MISSING'} {expected}")
              if not present:
                  raise SystemExit(f"the bundle is missing {expected}")
          # Qt shipped as ordinary, replaceable files: that is the technical half of
          # the LGPL-availability promise in packaging/seqkit_gui.spec, and the
          # headless platform plugin the CI note offers as a fallback.
          for expected in ("_internal/PySide6/Qt6Core.dll",
                           "_internal/PySide6/plugins/platforms/qoffscreen.dll"):
              present = (root / expected).is_file()
              print(f"{'ok  ' if present else 'MISSING'} {expected}")
              if not present:
                  raise SystemExit(f"the bundle is missing {expected}")
          PY

      - name: Assert the bundle contains no seqkit executable
        env:
          ARTIFACT_STEM: ${{ steps.version.outputs.stem }}
        run: |
          python - <<'PY'
          import os, pathlib, sys
          # seqkit_gui.core.paths.executable_names() -- the names the app would
          # find on this platform. None of them may travel with the GUI.
          forbidden = {"seqkit", "seqkit.exe", "seqkit.cmd", "seqkit.bat"}
          root = pathlib.Path("dist") / os.environ["ARTIFACT_STEM"]
          offenders = sorted(str(p) for p in root.rglob("*")
                             if p.is_file() and p.name.lower() in forbidden)
          dirs = sorted(str(p) for p in root.rglob("*")
                        if p.is_dir() and p.name.lower() == "bin")
          if offenders or dirs:
              print("FAIL: seqkit must not be redistributed with this GUI.", file=sys.stderr)
              for path in offenders:
                  print(f"  executable: {path}", file=sys.stderr)
              for path in dirs:
                  print(f"  bin directory: {path}", file=sys.stderr)
              print("  Users supply seqkit themselves: python tools/fetch_seqkit.py",
                    file=sys.stderr)
              sys.exit(1)
          print("verified: no seqkit executable and no bin/ directory inside the bundle")
          PY

      - name: Start the built application
        # The point of this step is that every DLL, Qt plugin and resource the
        # recipe collected actually resolves when the bundle runs, not only when
        # PyInstaller says it is done. If a runner's session ever makes a windowed
        # app misbehave, add QT_QPA_PLATFORM=offscreen to this step: the bundle
        # ships qoffscreen.dll, so the check keeps working without a desktop.
        shell: pwsh
        env:
          ARTIFACT_STEM: ${{ steps.version.outputs.stem }}
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "dist\$env:ARTIFACT_STEM\$env:ARTIFACT_STEM.exe"
          if (-not (Test-Path $exe)) {
              Write-Output "FAIL: expected the launcher at $exe"
              exit 1
          }
          $process = Start-Process -FilePath $exe -PassThru
          Write-Output "started pid=$($process.Id)"
          Start-Sleep -Seconds 20
          $process.Refresh()
          if ($process.HasExited) {
              Write-Output "FAIL: the bundle exited after $($process.ExitCode) instead of staying open"
              exit 1
          }
          Write-Output "ok: still running after 20 s, window title: '$($process.MainWindowTitle)'"
          Stop-Process -Id $process.Id -Force

      - name: Compress the bundle
        shell: pwsh
        env:
          BUNDLE_VERSION: ${{ steps.version.outputs.value }}
          ARTIFACT_STEM: ${{ steps.version.outputs.stem }}
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE 'release'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          # <APP_NAME>-<version>-windows-x64.zip, composed from the two declarations
          # the release-consistency step validated minutes ago.
          $zipName = "$env:ARTIFACT_STEM-$env:BUNDLE_VERSION-windows-x64.zip"
          $zip = Join-Path $stage $zipName
          if (Test-Path $zip) { Remove-Item $zip -Force }
          # The directory itself becomes the zip's single top-level entry, so
          # extracting yields <APP_NAME>/ next to wherever the user put it.
          Compress-Archive -Path (Join-Path $env:GITHUB_WORKSPACE "dist\$env:ARTIFACT_STEM") -DestinationPath $zip
          Get-Item $zip | Select-Object Name, Length | Format-List

      - name: Assert the zip carries only the GUI, and the folder the notes describe
        env:
          ARTIFACT_STEM: ${{ steps.version.outputs.stem }}
        run: |
          python - <<'PY'
          import os, pathlib, sys, zipfile
          forbidden = {"seqkit", "seqkit.exe", "seqkit.cmd", "seqkit.bat"}
          stem = os.environ["ARTIFACT_STEM"]
          zips = sorted(pathlib.Path("release").glob("*.zip"))
          if len(zips) != 1:
              print(f"FAIL: expected exactly one zip in release/, found {len(zips)}: "
                    + ", ".join(p.name for p in zips), file=sys.stderr)
              sys.exit(1)
          archive = zips[0]
          with zipfile.ZipFile(archive) as handle:
              # Entry names are compared with one spelling of the separator. A zip
              # member may legitimately carry "dir\file"; taking the basename after
              # "/" alone would then read the whole path as a file name and let
              # "SeqKit-GUI\bin\seqkit.exe" pass as a file called something else.
              raw = handle.namelist()
          names = [name.replace("\\", "/") for name in raw]
          hits = [name for name in names if name.rsplit("/", 1)[-1].lower() in forbidden]
          bins = [name for name in names if "/bin/" in name.lower()]
          # The release notes tell a user to put seqkit in <APP_NAME>/bin/ next to the
          # launcher, which is only true if extracting the zip produces that folder.
          tops = sorted({name.split("/", 1)[0] for name in names if name})
          print(f"{archive.name}: {len(raw)} entries, top level {tops}")
          wrong = [name for name in names if not name.startswith(stem + "/")]
          if wrong:
              print(f"FAIL: {len(wrong)} entries sit outside {stem}/: "
                    + ", ".join(wrong[:5]), file=sys.stderr)
              sys.exit(1)
          if hits or bins:
              print("FAIL: the artifact carries seqkit: " + ", ".join(hits + bins), file=sys.stderr)
              sys.exit(1)
          print("verified: the artifact holds the GUI and its Qt runtime only")
          PY
          # The same question asked a second time, by a different tool, over the
          # listing a human would eyeball. Anchored on a path separator and the end of
          # the line, because a bare substring search matches SeqKit-GUI.exe itself
          # (it contains "SeqKit") while an unanchored one misses nothing else either.
          unzip -l release/*.zip > zip-listing.txt
          if grep -Eiq '(^|[\\/])seqkit(\.exe|\.cmd|\.bat)?[[:space:]]*$' zip-listing.txt; then
            echo "::error::the zip listing names a seqkit executable"
            grep -Ei '(^|[\\/])seqkit(\.exe|\.cmd|\.bat)?[[:space:]]*$' zip-listing.txt
            exit 1
          fi
          echo "verified: unzip -l finds no seqkit executable"
          tail -n 8 zip-listing.txt

      - name: Compute the SHA-256 digest
        run: |
          python - <<'PY'
          import hashlib, pathlib, sys
          zips = sorted(pathlib.Path("release").glob("*.zip"))
          if len(zips) != 1:
              print(f"FAIL: expected one zip in release/, found {len(zips)}", file=sys.stderr)
              sys.exit(1)
          archive = zips[0]
          digest = hashlib.sha256()
          with archive.open("rb") as handle:
              for block in iter(lambda: handle.read(1024 * 1024), b""):
                  digest.update(block)
          # Two spaces: the line is exactly sha256sum's own format, so
          # `sha256sum -c <zip name>.sha256` works from the folder holding the zip.
          # Written here rather than in PowerShell because this file has to end with a
          # plain LF: a CRLF makes `sha256sum -c` read the carriage return as part of
          # the file name and report no properly formatted checksum lines.
          line = f"{digest.hexdigest()}  {archive.name}\n"
          (archive.parent / f"{archive.name}.sha256").write_text(line, encoding="ascii",
                                                                 newline="\n")
          print(f"SHA-256 of {archive.name}: {digest.hexdigest()}")
          print(line, end="")
          PY

      - name: Upload the artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # <APP_NAME>-<version>-windows-x64: the same two values the zip is named
          # after, so the download page, the file and the folder inside it agree.
          name: ${{ steps.version.outputs.stem }}-${{ steps.version.outputs.value }}-windows-x64
          path: release/
          if-no-files-found: error
          retention-days: 90

      - name: Hand the release over to a human
        env:
          ARTIFACT_STEM: ${{ steps.version.outputs.stem }}
          SEQKIT_VERSION: ${{ steps.version.outputs.seqkit_version }}
        run: |
          set -euo pipefail
          # Read back what this job actually produced instead of rebuilding the file
          # name from a template: the summary is what a person copies into the Release
          # page, and a digest that names a different file is worse than none.
          zip_path="$(ls release/*.zip | head -1)"
          zip_name="$(basename "$zip_path")"
          digest_name="$(basename "$zip_path").sha256"
          hash="$(cut -d' ' -f1 "release/$digest_name")"
          {
            printf '## Artifact\n\n'
            printf '| file | SHA-256 |\n'
            printf '| --- | --- |\n'
            printf '| `%s` | `%s` |\n\n' "$zip_name" "$hash"
            printf '`%s` holds the same line in sha256sum format. From the folder that\n' "$digest_name"
            printf 'holds the zip: `sha256sum -c "%s"`\n\n' "$digest_name"
            printf 'Verify after downloading, on any of:\n\n'
            printf '    PowerShell   Get-FileHash -Algorithm SHA256 "%s"\n' "$zip_name"
            printf '    cmd.exe      certutil -hashfile %s SHA256\n' "$zip_name"
            printf '    macOS/Linux  shasum -a 256 %s\n\n' "$zip_name"
            printf 'Compare the digest case-insensitively: certutil prints upper case,\n'
            printf 'Get-FileHash and this job print lower case.\n\n'
            printf '### Not in this archive\n\n'
            printf 'seqkit is **not** inside it, and never will be: it is upstream\n'
            printf 'software (MIT, by Wei Shen) that this GUI only shells out to.\n'
            printf 'Download the official build for your machine from\n'
            printf '<https://github.com/shenwei356/seqkit/releases> -- for this bundle\n'
            printf 'that is `seqkit_windows_amd64.exe.tar.gz` of the %s release -- and\n' "$SEQKIT_VERSION"
            printf 'put the executable in the `bin` folder next to the launcher:\n\n'
            printf '    %s/bin/seqkit.exe\n\n' "$ARTIFACT_STEM"
            printf 'Create the folder; the zip does not contain one. Without it the\n'
            printf 'window opens and reports that no SeqKit was found.\n'
            printf 'The other two ways in: pick the file in the Settings dialog, or put\n'
            printf 'seqkit somewhere on PATH. The search order is Settings, then `bin/`\n'
            printf 'beside the app, then PATH (seqkit_gui/core/seqkit_locator.py).\n'
            printf 'Someone running the source tree instead of this bundle can use\n'
            printf '`python tools/fetch_seqkit.py`, which downloads the asset for that\n'
            printf 'machine and verifies it against upstream'"'"'s `.md5.txt`.\n\n'
            printf '### Honest scope for the release notes\n\n'
            printf '* Unofficial desktop shell for SeqKit %s. Not a project of the\n' "$SEQKIT_VERSION"
            printf '  SeqKit authors; nothing here is supported by them.\n'
            printf '* The interface assembles arguments and reads output; every result\n'
            printf '  comes from the official executable the user supplies.\n'
            printf '* Real-machine testing happened on Windows only. The macOS and Linux\n'
            printf '  recipes in the project are unrun as desktop bundles, and this\n'
            printf '  artifact is a Windows x64 build.\n'
            printf '* The parameter table -- commands, flags and their types -- is\n'
            printf '  generated from SeqKit %s. Another upstream release may add, rename\n' "$SEQKIT_VERSION"
            printf '  or drop a flag; the interface says which release it describes.\n\n'
            printf '### Deliberately not done here\n\n'
            printf 'No GitHub Release was created, no release asset was uploaded, no tag\n'
            printf 'was made. This workflow holds read-only permission on contents.\n'
            printf 'A person writes the release notes, because they carry the\n'
            printf 'unofficial-project statement and the bring-your-own-seqkit warning;\n'
            printf 'attaching the two files above to the release is then a manual step.\n'
          } >> "$GITHUB_STEP_SUMMARY"


