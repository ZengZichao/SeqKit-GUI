# GitHub issue-forms configuration.
#
# blank_issues_enabled: false -- a blank issue cannot carry the environment, the
# seqkit version, or the assembled command line, which is what every report here
# needs before anyone can say anything useful. The three templates under
# .github/ISSUE_TEMPLATE/ cover bug / feature request / parameter-table mismatch.
blank_issues_enabled: false

contact_links:
  # This GUI does not compute anything: it assembles arguments and calls the
  # official seqkit executable. Crashes, wrong results and performance questions
  # about seqkit itself belong upstream, not here.
  - name: SeqKit 本体问题 / Problems in seqkit itself
    url: https://github.com/shenwei356/seqkit/issues
    about: seqkit 命令行的崩溃、性能与结果问题请找上游。本 GUI 只调用官方 seqkit，不重新分发它。

  # The parameter table shown in the interface is generated from this document's
  # source tree, so flag meanings and examples live here.
  - name: SeqKit 官方文档 / SeqKit documentation
    url: https://bioinf.shenwei.me/seqkit/
    about: 参数含义、示例与上游说明 / Flag meanings, examples and upstream reference.

  # ---------------------------------------------------------------------
